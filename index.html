<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blog App</title>
    <link rel="stylesheet" href="styles/reset.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="styles/index.css" />
  </head>
  <body>
    <div class="blog">
      <div class="container">
        <h1 class="blog__title">Приложение блог</h1>
        <div class="blog__row">
          <div class="blog__col">
            <div class="blog-item">
              <h2 class="blog-item__title">Новый пост</h2>
              <div class="blog-item__wrapper">
                <input
                  class="js-title-input blog-item__title-input"
                  type="text"
                  placeholder="Заголовок"
                />
                <button class="js-newpost-btn blog-item__newpost-btn" type="button">
                  Опубликовать
                </button>
              </div>
            </div>
          </div>
          <div class="blog__col">
            <div class="blog-item">
              <h2 class="blog-item__title blog-item__title_offset">Лента</h2>

            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="index.js"></script>
  </body>
</html>
